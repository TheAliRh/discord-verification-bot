[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifyguard"
version = "0.1.0"
description = "A modular Discord verification and anti-bot system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
{ name = "TheAliRh" }
]

keywords = [
"discord",
"discord-bot",
"verification",
"captcha",
"oauth2",
"anti-bot"
]

classifiers = [
"Development Status :: 4 - Beta",
"Intended Audience :: Developers",
"License :: OSI Approved :: MIT License",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.12",
"Programming Language :: Python :: 3.13",
]

dependencies = [
"discord.py>=2.4.0",
"aiosqlite>=0.20.0",
"aiohttp>=3.10.0",
"aiosmtplib>=3.0.0",
"Pillow>=10.0.0",
"python-dotenv>=1.0.0",
"twilio>=9.0.0",
]

[project.optional-dependencies]
dev = [
"pytest>=8.0.0",
"pytest-asyncio>=0.23.0",
"ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/TheAliRh/discord-verification-bot"
Repository = "https://github.com/TheAliRh/discord-verification-bot"
Issues = "https://github.com/TheAliRh/discord-verification-bot/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
"E",
"F",
"I",
"B",
]

[tool.setuptools]
py-modules = ["bot"]

[tool.setuptools.packages.find]
where = ["."]
include = [
"core*",
"modules*",
"settings*",
"ui*",
"web*",
]
