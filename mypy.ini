[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
check_untyped_defs = True
no_implicit_optional = True

# Every function/method in the codebase now has complete parameter and
# return type annotations, and every generic type (dict, list, Button,
# Select, etc.) is fully parameterized (e.g. dict[str, Any], not bare
# dict). These three flags make that a permanent requirement rather than
# a one-off cleanup - new code that skips type hints will fail this check
# instead of silently slipping through under the old, more lenient config.
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True

# Every runtime dependency (discord.py, aiohttp, aiosqlite, aiosmtplib,
# python-dotenv, Pillow) ships its own type stubs, so we don't need
# ignore_missing_imports at all - a missing-stub error here means an actual
# typo in an import, not a third-party library gap.

exclude = ^(tests/|assets/)